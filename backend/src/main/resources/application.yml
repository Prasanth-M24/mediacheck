spring:
  application:
    name: mediacheck-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mediacheck}
    username: ${SPRING_DATASOURCE_USERNAME:mediacheck_app}
    password: ${SPRING_DATASOURCE_PASSWORD:replace_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MEDIACHECK_SMTP_HOST:}
    port: ${MEDIACHECK_SMTP_PORT:587}
    username: ${MEDIACHECK_SMTP_USERNAME:}
    password: ${MEDIACHECK_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${MEDIACHECK_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MEDIACHECK_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MEDIACHECK_SMTP_STARTTLS:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
server:
  port: ${SERVER_PORT:8080}
mediacheck:
  version: ${APP_VERSION:0.1.0}
  ai-service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  storage:
    provider: ${MEDIACHECK_STORAGE_PROVIDER:local}
    path: ${MEDIACHECK_STORAGE_PATH:./mediacheck-data}
    b2:
      configured: ${B2_CONFIGURED:false}
      endpoint: ${B2_ENDPOINT:}
      bucket-name: ${B2_BUCKET_NAME:}
      region: ${B2_REGION:}
  security:
    jwt-secret: ${MEDIACHECK_JWT_SECRET:}
    issuer: ${MEDIACHECK_JWT_ISSUER:http://localhost:8080}
    access-token-seconds: ${MEDIACHECK_ACCESS_TOKEN_SECONDS:600}
    refresh-token-days: ${MEDIACHECK_REFRESH_TOKEN_DAYS:14}
    refresh-cookie-secure: ${MEDIACHECK_REFRESH_COOKIE_SECURE:false}
    dev-token-delivery: ${MEDIACHECK_DEV_TOKEN_DELIVERY:false}
    cors-origins: ${MEDIACHECK_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  email:
    enabled: ${MEDIACHECK_EMAIL_ENABLED:false}
    from: ${MEDIACHECK_EMAIL_FROM:}
    public-app-url: ${MEDIACHECK_PUBLIC_APP_URL:http://localhost:5173}
